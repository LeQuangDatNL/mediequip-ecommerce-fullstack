spring.application.name=shop

# Mặc định kích hoạt profile 'dev' khi chạy local (nếu trên Render truyền SPRING_PROFILES_ACTIVE=prod thì sẽ override dòng này)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================================================
# 1. CẤU HÌNH DATABASE MYSQL / TIDB CLOUD
# =========================================================
# URL mặc định trỏ thẳng TiDB Cloud với cờ bảo mật SSL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/ecommerce_db?sslMode=VERIFY_IDENTITY&useSSL=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:3rSspJ8MbZM3jQY.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# TỐI ƯU BẮT BUỘC CHO RENDER FREE TIER (512MB RAM):
# Giới hạn connection pool nhỏ để tránh tràn RAM (OOM)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# =========================================================
# 2. CẤU HÌNH SWAGGER UI OPENAPI
# =========================================================
springdoc.swagger-ui.persistAuthorization=true

# =========================================================
# 3. BẢO MẬT XÁC THỰC JWT
# =========================================================
app.jwt.secret=${APP_JWT_SECRET:your_secure_random_jwt_secret_key_minimum_32_characters}
app.jwt.expiration=3600000

# =========================================================
# 4. CẤU HÌNH GỬI EMAIL THÔNG BÁO TỰ ĐỘNG (GMAIL SMTP)
# =========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email Quản trị viên nhận thông báo khi có yêu cầu tư vấn / báo giá:
app.admin.notification-email=${APP_ADMIN_NOTIFICATION_EMAIL:lienkehoach@gmail.com}