version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL 8.0
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 
      MYSQL_ROOT_PASSWORD: 
    ports:
      - ":3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shop-network

  # -------------------------------------------------------------
  # 2. Backend Spring Boot (Java 21)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./BE/shop
      dockerfile: Dockerfile
    container_name: shop-backend
    restart: unless-stopped
    ports:
      - ":8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: 
      SPRING_DATASOURCE_PASSWORD: 
      APP_JWT_SECRET: 
      SPRING_MAIL_HOST: 
      SPRING_MAIL_PORT: 
      SPRING_MAIL_USERNAME: 
      SPRING_MAIL_PASSWORD: 
      APP_ADMIN_NOTIFICATION_EMAIL: 
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop-network

  # -------------------------------------------------------------
  # 3. Frontend React (Vite + Tailwind CSS + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./FE/shop
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: 
    container_name: shop-frontend
    restart: unless-stopped
    ports:
      - ":80"
    depends_on:
      - backend
    networks:
      - shop-network

volumes:
  mysql_data:
    driver: local

networks:
  shop-network:
    driver: bridge