spring.application.name=shop

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bop123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Swagger UI tự động lưu JWT token khi F5 / tải lại trang
springdoc.swagger-ui.persistAuthorization=true

app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
app.jwt.expiration=3600000

# =========================================================
# CẤU HÌNH GỬI EMAIL THÔNG BÁO TỰ ĐỘNG QUA GMAIL SMTP
# =========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
# Điền địa chỉ Gmail gửi đi của bạn tại biến môi trường hoặc file .env:
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
# Điền Mật khẩu ứng dụng 16 ký tự của Google (Google App Password) tại đây:
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email của Quản trị viên (Admin) nhận thông báo khi có khách gửi file/yêu cầu tư vấn:
app.admin.notification-email=${APP_ADMIN_NOTIFICATION_EMAIL:admin@mediequip.vn}

