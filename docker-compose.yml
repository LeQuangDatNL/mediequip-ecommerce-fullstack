version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL 8.0
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shop-network

  # -------------------------------------------------------------
  # 2. Backend Spring Boot (Java 21)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./BE/shop
      dockerfile: Dockerfile
    container_name: shop-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecommerce_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-your_secure_random_jwt_secret_key_minimum_32_characters}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-your_email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-your_app_password}
      APP_ADMIN_NOTIFICATION_EMAIL: ${APP_ADMIN_NOTIFICATION_EMAIL:-lienkehoach@gmail.com}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop-network

  # -------------------------------------------------------------
  # 3. Frontend React (Vite + Tailwind CSS + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./FE/shop
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: shop-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shop-network

volumes:
  mysql_data:
    driver: local

networks:
  shop-network:
    driver: bridge