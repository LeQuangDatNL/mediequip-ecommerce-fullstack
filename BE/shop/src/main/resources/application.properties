spring.application.name=shop

# =========================================================
# 1. CẤU HÌNH DATABASE MYSQL (ẨN MẬT KHẨU - DÙNG BIẾN MÔI TRƯỜNG)
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# =========================================================
# 2. CẤU HÌNH SWAGGER UI OPENAPI
# =========================================================
springdoc.swagger-ui.persistAuthorization=true

# =========================================================
# 3. BẢO MẬT XÁC THỰC JWT
# =========================================================
app.jwt.secret=${APP_JWT_SECRET:your_secure_random_jwt_secret_key_minimum_32_characters}
app.jwt.expiration=3600000

# =========================================================
# 4. CẤU HÌNH GỬI EMAIL THÔNG BÁO TỰ ĐỘNG (GMAIL SMTP)
# =========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email Quản trị viên nhận thông báo khi có khách gửi file/yêu cầu tư vấn:
app.admin.notification-email=${APP_ADMIN_NOTIFICATION_EMAIL:lienkehoach@gmail.com}

